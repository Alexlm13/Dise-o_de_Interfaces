<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>
<body>
    <form>
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" required><span></span><br><br>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required><span></span><br><br>

    <label for="password">Contraseña</label>
    <input type="password" id="password" required><span></span><br><br>

    <label for="telefono">Teléfono</label>
    <input type="tel" id="telefono"><span></span><br><br>

    <label for="empresa">Empresa</label>
    <input type="text" id="empresa"><span></span><br><br>

    <label for="nacimiento">Fecha de nacimiento</label>
    <input type="date" id="nacimiento"><span></span><br><br>

    <button type="submit">Registrarse</button>
</form>
</body>
</html>
