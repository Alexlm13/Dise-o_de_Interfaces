<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>
<body>
    <form>
    <h2>Preferencias de comunicación</h2>

    <input type="checkbox" id="ofertas" name="ofertas">
    <label for="ofertas">Recibir ofertas por correo electrónico</label>
    <br>

    <input type="checkbox" id="pedidos" name="pedidos">
    <label for="pedidos">Recibir notificaciones sobre pedidos</label>
    <br>

    <input type="checkbox" id="productos" name="productos">
    <label for="productos">Recibir información sobre nuevos productos</label>
    <br>

    <input type="checkbox" id="encuestas" name="encuestas">
    <label for="encuestas">Participar en encuestas de satisfacción</label>

    <h3>Método de contacto preferido</h3>

    <input type="radio" id="email" name="contacto" value="email">
    <label for="email">Correo electrónico</label>
    <br>

    <input type="radio" id="telefono" name="contacto" value="telefono">
    <label for="telefono">Teléfono</label>
    <br>

    <input type="radio" id="sms" name="contacto" value="sms">
    <label for="sms">SMS</label>
    <br><br>

    <button type="submit">Guardar preferencias</button>
</form>
</body>
</html>
