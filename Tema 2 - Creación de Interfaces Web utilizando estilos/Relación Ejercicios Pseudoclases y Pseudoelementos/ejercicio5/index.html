<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="18" max="99"><br><br>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="8"><br><br>

        <label for="web">Sitio web personal</label>
        <input type="url" id="web" name="web"><br><br>

        <button type="submit">Registrarse</button>
    </form>
</body>

</html>
