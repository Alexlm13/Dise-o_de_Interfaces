<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Pseudoclases y Pseudoelementos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <form action="#" method="post">

            <p>
                <label for="nombre">Su nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </p>

            <p>
                <label for="edad">Su edad:</label>
                <input type="text" id="edad" name="edad" disabled>
            </p>

            <fieldset>
                <legend>Sexo</legend>
                <p>
                    <input type="radio" id="hombre" name="sexo" value="hombre">
                    <label for="hombre">Hombre</label>
                </p>
                <p>
                    <input type="radio" id="mujer" name="sexo" value="mujer">
                    <label for="mujer">Mujer</label>
                </p>
            </fieldset>

            <p>
                <input type="checkbox" id="condiciones" name="condiciones">
                <label for="condiciones">Estoy de acuerdo con las condiciones de uso</label>
            </p>

        </form>
    </main>
</body>

</html>
