<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipos de cursores CSS</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Tipos de cursores CSS</h1>
  </header>

  <main class="contenedor">
    <div class="caja crosshair">crosshair</div>
    <div class="caja help">help</div>
    <div class="caja move">move</div>
    <div class="caja pointer">pointer</div>

    <div class="caja progress">progress</div>
    <div class="caja text">text</div>
    <div class="caja wait">wait</div>
    <div class="caja vertical-text">vertical-text</div>

    <div class="caja alias">alias</div>
    <div class="caja no-drop">no-drop</div>
    <div class="caja grab">grab</div>
    <div class="caja grabbing">grabbing</div>

    <div class="caja zoom-in">zoom-in</div>
    <div class="caja zoom-out">zoom-out</div>
    <div class="caja not-allowed">not-allowed</div>
    <div class="caja copy">copy</div>

    <div class="caja ew-resize">ew-resize</div>
    <div class="caja ns-resize">ns-resize</div>
    <div class="caja nwse-resize">nwse-resize</div>
    <div class="caja nesw-resize">nesw-resize</div>

    <div class="caja col-resize">col-resize</div>
    <div class="caja row-resize">row-resize</div>
    <div class="caja context-menu">context-menu</div>
    <div class="caja none">none</div>

    <div class="caja personalizado">Personalized</div>
  </main>
</body>
</html>
