<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Ejercicio práctico con Tablas</h1>

    <table border="1" width="90%" cellpadding="20" cellspacing="0">

        <!-- IMÁGENES -->
        <tr>
            <td></td>
            <td colspan="3" align="center">
                <img src="./ipod1.webp" width="120">
            </td>
            <td colspan="2" align="center">
                <img src="./ipod2.png" width="120">
            </td>
        </tr>
        <!-- CAPACIDAD -->
        <tr>
            <td align="center"><b>Capacidad</b></td>
            <td>2GB</td>
            <td>4GB</td>
            <td>8GB</td>
            <td>32GB</td>
            <td>2GB</td>
        </tr>
        <!-- COLORES -->
        <tr>
            <td align="center" rowspan="2"><b>Colores</b></td>
            <td rowspan="2"><b>Blanco</b></td>
            <td rowspan="2">
                <ul>
                    <li>Negro</li>
                    <li>Rosa</li>
                    <li>Dorado</li>
                </ul>
            </td>
            <td align="center" rowspan="2"><b>Negro</b></td>
            <td rowspan="2" colspan="2">
                <ul>
                    <li>Negro</li>
                    <li>Blanco</li>
                </ul>
            </td>
        </tr>
        <tr></tr>
        <!-- PANTALLA -->
        <tr>
            <td align="center"><b>Pantalla</b></td>
            <td align="center" colspan="3"><b>3 pulgadas</b></td>
            <td align="center" colspan="2"><b>7 pulgadas</b></td>
        </tr>
        <!-- TIEMPO DE CARGA-->
        <tr>
            <td align="center" rowspan="2"><b>Tiempo de Carga</b></td>
            <td align="center" rowspan="2" colspan="3"><b>1 hora</b></td>
            <td align="center" colspan="2"><b>5 horas</b></td>
        </tr>
        <tr>
            <td align="center" colspan="2"><b>30 minutos para 75%</b></td>
        </tr>
    </table>
</body>

</html>
